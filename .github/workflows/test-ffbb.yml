name: Test accès FFBB

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer la bibliothèque FFBB
        run: pip install --quiet ffbb-data-client

      - name: Lire la poule A (classement + matchs)
        run: |
          python - <<'EOF'
          import json
          from ffbb_data_client import FFBBDataClient

          def plat(o):
              if hasattr(o, "model_dump"):
                  return o.model_dump(mode="json")
              if hasattr(o, "__dict__"):
                  return {k: v for k, v in vars(o).items() if not k.startswith("_")}
              return o

          client = FFBBDataClient.create()
          poule = client.get_poule(200000003054328)
          d = plat(poule)
          print("Nom :", getattr(poule, "nom", "?"))
          print("Champs de la poule :", list(d.keys()) if isinstance(d, dict) else type(d))

          cl = getattr(poule, "classement", None) or []
          print("\n=== CLASSEMENT :", len(cl), "lignes ===")
          for r in cl:
              print(json.dumps(plat(r), ensure_ascii=False, default=str)[:600])

          for nom in ("rencontres", "matchs", "matches", "games"):
              rs = getattr(poule, nom, None)
              if rs:
                  print(f"\n=== {nom.upper()} :", len(rs), "===")
                  for r in rs[:3]:
                      print(json.dumps(plat(r), ensure_ascii=False, default=str)[:1500])
                  break
          else:
              print("\nAucun attribut de matchs trouvé parmi : rencontres, matchs, matches, games")
          EOF
